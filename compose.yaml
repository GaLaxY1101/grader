services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=grader-db'
      - 'POSTGRES_PASSWORD=graderpass123'
      - 'POSTGRES_USER=illia'
      - 'PGTZ=Europe/Kyiv'
    ports:
      - '5432:5432'

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.0'
    environment:
      - 'KEYCLOAK_ADMIN=admin'
      - 'KEYCLOAK_ADMIN_PASSWORD=admin'
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - '9080:8080'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # One-shot: sets email on master 'admin' + pushes SMTP password into realm.
  # Each step skipped when its env var is empty. See deploy/keycloak/configure-admin.sh.
  keycloak-config:
    image: 'quay.io/keycloak/keycloak:26.0'
    entrypoint: ["/bin/sh", "/configure-admin.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN_EMAIL: ${KEYCLOAK_ADMIN_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./deploy/keycloak/configure-admin.sh:/configure-admin.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  gitlab:
    image: gitlab/gitlab-ce:16.9.1-ce.0
    container_name: grader-gitlab
    hostname: gitlab.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['lfs_enabled'] = false
        prometheus_monitoring['enable'] = false
        grafana['enable'] = false
        alertmanager['enable'] = false
    ports:
      - '8929:8929'
      - '2224:22'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - grader-network
    shm_size: '256m'

  gitlab-runner:
    image: gitlab/gitlab-runner:v16.9.1
    container_name: grader-gitlab-runner
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab_runner_config:/etc/gitlab-runner
    networks:
      - grader-network
    depends_on:
      - gitlab

  s3mock:
    image: 'adobe/s3mock:latest'
    environment:
      - 'initialBuckets=grader-attachments'
      - 'retainFilesOnExit=true'
    ports:
      - '9000:9090'
    volumes:
      - minio_data:/s3mockroot

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner_config:
  minio_data:

networks:
  grader-network:
    driver: bridge
