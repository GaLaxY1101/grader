services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=grader-db'
      - 'POSTGRES_PASSWORD=graderpass123'
      - 'POSTGRES_USER=illia'
      - 'PGTZ=Europe/Kyiv'
    ports:
      - '5432:5432'

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.0'
    environment:
      - 'KEYCLOAK_ADMIN=admin'
      - 'KEYCLOAK_ADMIN_PASSWORD=admin'
    command: start-dev
    ports:
      - '9080:8080'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s