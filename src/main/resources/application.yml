spring:
  application:
    name: grader
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/grader-db
    username: illia
    password: graderpass123

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/university-grader}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:9080/realms/university-grader/protocol/openid-connect/certs}

  threads:
    virtual:
      enabled: true

keycloak:
  realm: ${KEYCLOAK_REALM:university-grader}
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:9080}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}

  docker:
    compose:
      file: compose.yaml

server:
  port: 8080

grader:
  jwt:
    secret: ${GRADER_JWT_SECRET:change-me-in-production-min-32-chars!!}
    expiration-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ua.kpi.grader: DEBUG
    org.flywaydb: INFO

gitlab:
  base-url: ${GITLAB_BASE_URL:http://localhost:8929}
  token: ${GITLAB_TOKEN:}
  group-name: ${GITLAB_GROUP_NAME:grader}
  webhook-secret: ${GITLAB_WEBHOOK_SECRET:webhook-secret-change-me}
  runner-token: ${GITLAB_RUNNER_TOKEN:}
  webhook-base-url: ${GITLAB_WEBHOOK_BASE_URL:http://host.docker.internal:8080}
