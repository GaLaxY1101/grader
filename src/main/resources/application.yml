spring:
  application:
    name: grader
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/grader-db
    username: illia
    password: graderpass123

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 150MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/university-grader}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:9080/realms/university-grader/protocol/openid-connect/certs}

  threads:
    virtual:
      enabled: true

keycloak:
  realm: ${KEYCLOAK_REALM:university-grader}
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:9080}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}

  docker:
    compose:
      file: compose.yaml

server:
  port: 8080

grader:
  jwt:
    secret: ${GRADER_JWT_SECRET:change-me-in-production-min-32-chars!!}
    expiration-hours: 24
  cors:
    # Comma-separated frontend origins.
    allowed-origins: ${GRADER_CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ua.kpi.grader: DEBUG
    org.flywaydb: INFO

gitlab:
  base-url: ${GITLAB_BASE_URL:http://localhost:8929}
  token: ${GITLAB_TOKEN:}
  group-name: ${GITLAB_GROUP_NAME:grader}
  webhook-secret: ${GITLAB_WEBHOOK_SECRET:webhook-secret-change-me}
  runner-token: ${GITLAB_RUNNER_TOKEN:}
  webhook-base-url: ${GITLAB_WEBHOOK_BASE_URL:http://host.docker.internal:8080}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:grader}
  secret-key: ${MINIO_SECRET_KEY:graderminio123}
  bucket: ${MINIO_BUCKET:grader-attachments}
  presign-ttl-seconds: ${MINIO_PRESIGN_TTL:300}

testgen:
  provider: ${TESTGEN_PROVIDER:gemini}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5-coder:3b}
    timeout-seconds: 180
    keep-alive: 30m
    num-ctx: 8192
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${TESTGEN_MODEL:gemini-3.8-flash}
    timeout-seconds: 60
    max-output-tokens: 8192
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
  temperature: 0.2
  max-iterations: 3
  min-test-count: 5
  mutation-feedback: true
  max-mutants: 10
  prune-failing: true
  sandbox:
    cpp-image: grader-sandbox-cpp:1
    python-image: grader-sandbox-py:1
    timeout-seconds: 20
    mutant-timeout-seconds: 5
    memory: 256m
    cpus: "1"
