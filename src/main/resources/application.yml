spring:
  application:
    name: grader

  datasource:
    url: jdbc:postgresql://localhost:5432/grader-db
    username: illia
    password: graderpass123

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  docker:
    compose:
      file: compose.yaml

server:
  port: 8080

grader:
  jwt:
    secret: ${GRADER_JWT_SECRET:change-me-in-production-min-32-chars!!}
    expiration-hours: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ua.kpi.grader: DEBUG
    org.flywaydb: INFO
