image: gcc:13

stages:
  - test

test:
  stage: test
  script:
    - |
      g++ -std=c++17 -DGRADER_MAIN -o test_runner test.cpp 2> compile.log || {
        echo '##GRADER## {"event":"compile_failed"}'
        cat compile.log
        exit 1
      }
    - |
      timeout 10s ./test_runner || {
        rc=$?
        if [ $rc -eq 124 ]; then echo '##GRADER## {"event":"timeout"}'; fi
        exit $rc
      }
